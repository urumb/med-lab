{% extends "booking/base.html" %}

{% block title %}Server Error (500) - MedLab Diagnostics{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-5 shadow-sm border-0">
                <div class="text-warning mb-3">
                    <i class="bi bi-exclamation-triangle display-1"></i>
                </div>
                <h1 class="fw-bold text-dark mb-2">500 - Server Error</h1>
                <p class="text-muted mb-4">An unexpected laboratory system error occurred. Our technical staff has been notified.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'booking:home' %}" class="btn btn-primary fw-semibold px-4">Back to Home</a>
                    <a href="{% url 'booking:contact' %}" class="btn btn-outline-secondary fw-semibold px-4">Contact Support</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
